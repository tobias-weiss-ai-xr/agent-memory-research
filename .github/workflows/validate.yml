name: Validate Papers

on:
  push:
    branches: [main]
    paths:
      - 'papers.yaml'
      - 'scripts/'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'papers.yaml'
      - 'scripts/'
      - 'requirements.txt'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Validate papers.yaml
        continue-on-error: false
        run: python3 scripts/validate_papers.py

      - name: Check README is up-to-date
        continue-on-error: false
        run: python3 scripts/generate_readme.py --check
